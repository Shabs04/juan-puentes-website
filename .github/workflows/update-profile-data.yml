name: Update public profile data

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh public profile data
        run: node scripts/update-profile-data.mjs

      - name: Commit refreshed data
        run: |
          if [[ -n "$(git status --porcelain data/profile.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/profile.json
            git commit -m "Update public profile data"
            git push
          else
            echo "No profile data changes."
          fi
