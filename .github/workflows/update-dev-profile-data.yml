name: Update dev public profile data

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-main-writes
  cancel-in-progress: false

jobs:
  update-dev-profile-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev-site

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh public profile data on dev
        working-directory: dev-site
        run: node scripts/update-profile-data.mjs

      - name: Commit refreshed dev data
        working-directory: dev-site
        run: |
          if [[ -n "$(git status --porcelain data/profile.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/profile.json
            git commit -m "Update dev public profile data"
            git push origin HEAD:dev
          else
            echo "No dev profile data changes."
          fi

      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: production-site

      - name: Copy refreshed public data to production
        run: cp dev-site/data/profile.json production-site/data/profile.json

      - name: Publish refreshed production data
        working-directory: production-site
        run: |
          if [[ -n "$(git status --porcelain data/profile.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/profile.json
            git commit -m "Update production public profile data"
            git push origin HEAD:main
          else
            echo "Production profile data is already up to date."
          fi
